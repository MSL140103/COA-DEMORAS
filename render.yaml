databases:
  - name: laytime-db
    plan: free
    databaseName: laytime
    user: laytime

services:
  - type: web
    name: laytime-backend
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: LAYTIME_DATABASE_URL
        fromDatabase:
          name: laytime-db
          property: connectionString
      - key: LAYTIME_STORAGE_DIR
        value: /app/var/storage
      - key: LAYTIME_CORS_ORIGINS
        value: '["*"]'
    # Render's free plan doesn't support persistent disks, so uploaded documents
    # live on the container's ephemeral filesystem — they're lost on redeploy or
    # restart. Fine for a demo; for real use, either upgrade to a paid plan with a
    # disk, or swap app/infrastructure/storage/local.py for an S3-compatible client.

  - type: web
    name: laytime-frontend
    runtime: docker
    plan: free
    rootDir: frontend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: BACKEND_HOST
        fromService:
          type: web
          name: laytime-backend
          property: host
